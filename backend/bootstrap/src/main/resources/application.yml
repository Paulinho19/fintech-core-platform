spring:
  application:
    name: fintech-core-platform

  threads:
    virtual:
      enabled: true # RNF03 - virtual threads para I/O bloqueante (Tomcat + @Async)

  datasource:
    url: jdbc:postgresql://localhost:5432/fintech
    username: fintech
    password: fintech
    hikari:
      maximum-pool-size: 20

  jpa:
    hibernate:
      ddl-auto: validate # schema sempre via Flyway, nunca auto-gerado
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379
    mongodb:
      uri: mongodb://localhost:27017/fintech-audit

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: fintech-core
      auto-offset-reset: earliest

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.fintech.core: DEBUG
